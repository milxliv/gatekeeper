[package]
name = "gatekeeper"
version = "0.4.0"
edition = "2021"
description = "Self-hosted reception-desk visitor management for any small to mid-size business"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dotenvy = "0.15"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["rand_core"] }
totp-rs = { version = "5", features = ["qr", "gen_secret"] }

# Native TLS for browser ↔ server (auto self-signed on first run)
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"
gethostname = "0.5"

# Magic-byte file sniffing for photo upload validation
infer = "0.16"
